<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codez Games - Play Awesome Games</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>🎮 CODEZ GAMES</h1>
        <p>Unlimited Games • Play Now</p>
    </div>

    <div class="games-container">
        <!-- Snake Game -->
        <div class="game-tile" onclick="startGame('snake')">
            <div class="game-tile-icon">🐍</div>
            <div class="game-tile-title">SNAKE</div>
            <div class="game-tile-desc">Eat & Grow</div>
        </div>

        <!-- Tic Tac Toe -->
        <div class="game-tile" onclick="startGame('tictactoe')">
            <div class="game-tile-icon">⭕</div>
            <div class="game-tile-title">TIC TAC TOE</div>
            <div class="game-tile-desc">Beat the AI</div>
        </div>

        <!-- 2048 -->
        <div class="game-tile" onclick="startGame('2048')">
            <div class="game-tile-icon">2️⃣</div>
            <div class="game-tile-title">2048</div>
            <div class="game-tile-desc">Combine Tiles</div>
        </div>

        <!-- Memory Game -->
        <div class="game-tile" onclick="startGame('memory')">
            <div class="game-tile-icon">🧠</div>
            <div class="game-tile-title">MEMORY</div>
            <div class="game-tile-desc">Match Pairs</div>
        </div>

        <!-- Flappy Bird -->
        <div class="game-tile" onclick="startGame('flappy')">
            <div class="game-tile-icon">🐦</div>
            <div class="game-tile-title">FLAPPY BIRD</div>
            <div class="game-tile-desc">Fly & Survive</div>
        </div>
    </div>

    <!-- Game Modal -->
    <div id="gameModal" class="modal" style="display: none;">
        <div class="modal-content">
            <button class="close-btn" onclick="closeGame()">✕</button>
            <div id="gameArea"></div>
        </div>
    </div>

    <script src="games/snake.js"></script>
    <script src="games/tictactoe.js"></script>
    <script src="games/2048.js"></script>
    <script src="games/memory.js"></script>
    <script src="games/flappy.js"></script>
    <script src="main.js"></script>
</body>
</html>
